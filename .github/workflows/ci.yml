name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Testler saf-Python (agent/ + data/sft normalize/persona); torch/transformers
      # yalniz --gguf yolunda lazy-import -> CI'da agir bagimlilik gerekmez, sadece pytest.
      - name: Install pytest
        run: pip install "pytest>=9.1.1"
      - name: Run tests
        run: pytest -q
