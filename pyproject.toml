[project]
name = "octopus"
version = "0.0.1"
description = "Türkçe-önce, siber güvenlik odaklı, sıfırdan eğitilen dil modeli"
requires-python = ">=3.10"
dependencies = [
    "sentencepiece>=0.2.0",
    "datasets>=2.20.0",
    "huggingface-hub>=0.24.0",
    "transformers>=4.44.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

# Pretraining bağımlılıkları (torch cu128 — Blackwell/RTX 5060) tokenizer fazında GEREKMEZ;
# model fazına geçince ayrı bir index ile eklenecek. Şimdilik hafif tutuyoruz.
[project.optional-dependencies]
train = []

[tool.uv]
# Bu repo paketlenebilir bir kütüphane değil; `uv sync` yalnızca bağımlılıkları kursun.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Repo kökünü path'e ekle: `agent` ve `data.sft.*` importları çözülsün.
# importlib modu: test dosyalarını yol üzerinden import eder → tests/agent 'agent'
# gerçek paketiyle çakışmaz (parent dizini sys.path'e sokmaz).
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
